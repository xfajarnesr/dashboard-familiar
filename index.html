<script>
/* Si en 12 s l'app no ha arrencat, ofereix tornar-la a carregar netejant la memòria cau */
setTimeout(function () {
  var b = document.getElementById('boot');
  if (!b) return;
  b.innerHTML = '<p>No s\'ha pogut obrir l\'app.</p><button class="btn primary" id="reboot">Torna-la a carregar</button>';
  document.getElementById('reboot').onclick = async function () {
    try {
      if (navigator.serviceWorker) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
      if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
    } catch (e) {}
    location.reload();
  };
}, 12000);
</script>
